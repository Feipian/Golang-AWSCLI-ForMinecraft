name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Check Docker Hub credentials
      run: |
        if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "❌ DOCKER_USERNAME secret is not set"
          echo "Please add DOCKER_USERNAME to your repository secrets"
          exit 1
        fi
        if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
          echo "❌ DOCKER_PASSWORD secret is not set"
          echo "Please add DOCKER_PASSWORD to your repository secrets"
          exit 1
        fi
        echo "✅ Docker Hub credentials are configured"
        echo "Username: ${{ secrets.DOCKER_USERNAME }}"
    
    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USERNAME != '' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/minecraft-server:latest
          ${{ secrets.DOCKER_USERNAME }}/minecraft-server:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/minecraft-server:${{ github.event.release.tag_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
